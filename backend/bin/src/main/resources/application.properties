# ==============================================================================
# SLCMS Production Spring Boot Application Configuration
# ==============================================================================

server.port=${PORT:8080}

# Database Configuration
# In production on Render/Railway/Fly/Heroku/AWS, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# When running locally without external DB, falls back to persistent file-backed H2 database in ./data/slcmsdb
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/slcmsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate DDL: Strictly 'update' in production to preserve all user accounts and cases across deployments
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Prevent automatic schema reset scripts
spring.sql.init.mode=never

# Security & JWT Configuration
slcms.jwt.secret=${JWT_SECRET:slcms-enterprise-secure-jwt-secret-key-2026-tanzania-legal}
slcms.jwt.expiration-hours=24

# CORS: Allowed Frontend URL (e.g., https://your-slcms.vercel.app)
slcms.cors.frontend-url=${FRONTEND_URL:https://your-slcms.vercel.app}

# File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================================================
# Gmail SMTP Configuration (credentials supplied via environment variables ONLY)
# Set MAIL_USERNAME and MAIL_PASSWORD in your OS environment before starting.
# ==============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:legalcasem@gmail.com}
spring.mail.password=${MAIL_PASSWORD:lcjurtvncsvlhdxx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
